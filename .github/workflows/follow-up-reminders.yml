name: APE follow-up reminders
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate response handling without calling the reminder API or sending emails'
        type: boolean
        default: true
        required: true
      test_failure_alert:
        description: 'In dry run only, simulate a failed send to test GitHub incident creation'
        type: boolean
        default: false
        required: true
concurrency:
  group: ape-follow-up-reminders
  cancel-in-progress: false
jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run secured reminder check
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: using a synthetic success response; no reminder API call"
            if [ "${{ inputs.test_failure_alert }}" = "true" ]; then
              echo "DRY RUN: simulating one failed reminder to verify incident reporting; no API call"
              response='{"ok":true,"checked":1,"sent":0,"failed":1,"customerChecked":0,"customerSent":0,"customerFailed":0,"customerEnabled":false}'
            else
              response='{"ok":true,"checked":0,"sent":0,"failed":0,"customerChecked":0,"customerSent":0,"customerFailed":0,"customerEnabled":false}'
            fi
          else
            if [ -z "$REMINDER_CRON_SECRET" ]; then
              echo "::error::REMINDER_CRON_SECRET repository secret is missing"
              exit 1
            fi
            response=$(curl --fail-with-body --show-error --silent --retry 2 --retry-delay 2 --max-time 30 \
              --request POST \
              --header "Authorization: Bearer $REMINDER_CRON_SECRET" \
              "https://aiprofitengine.ai/api/follow-up-reminders")
          fi
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          try:
              data = json.loads(os.environ["RESPONSE"])
          except (ValueError, KeyError):
              print("::error::Reminder endpoint returned invalid JSON")
              sys.exit(1)

          fields = ("checked", "sent", "failed", "customerChecked", "customerSent", "customerFailed")
          if data.get("ok") is not True or any(type(data.get(k)) is not int or data[k] < 0 for k in fields):
              print("::error::Reminder endpoint returned an invalid or unsuccessful result")
              sys.exit(1)

          print("Reminder summary: " + ", ".join(f"{k}={data[k]}" for k in fields))
          print(f"Customer follow-ups enabled: {data.get('customerEnabled') is True}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## A.P.E. reminder check\n\n")
                  summary.write("| Metric | Count |\n|---|---:|\n")
                  for key in fields:
                      summary.write(f"| {key} | {data[key]} |\n")
                  summary.write(f"\nCustomer follow-ups enabled: {data.get('customerEnabled') is True}\n")
          if data["failed"] or data["customerFailed"]:
              print("::error::One or more reminder sends failed; review Cloudflare logs")
              sys.exit(1)
          PY

  report-failure:
    needs: send-reminders
    if: ${{ always() && needs.send-reminders.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update reminder incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="A.P.E. reminder automation failure"
          existing=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "A.P.E. reminder automation failure") | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Reminder workflow failed again. Review run: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled A.P.E. reminder workflow failed. Review run: $RUN_URL

          Check the workflow summary and Cloudflare logs. Do not manually resend customer emails until delivery outcomes are reconciled."
          fi
