<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pilot Login | AI Profit Engine</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0%,#35131d,#090b10 65%);color:#f7f7fa;font:16px/1.6 system-ui,sans-serif}main{max-width:540px;margin:8vh auto;padding:30px}.panel{background:#181a25;border:1px solid #45404b;border-radius:18px;padding:30px}h1{font-size:clamp(30px,5vw,44px);line-height:1.2}p{color:#bfc2ce}label{display:block;margin:15px 0 5px}input{width:100%;padding:13px;border:1px solid #777986;border-radius:8px;background:#090b10;color:white;font-size:17px}button{background:#ef4757;color:white;border:0;border-radius:9px;padding:13px 20px;font-weight:800;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}a{color:#ff8991}.hidden{display:none}</style></head><body><main><a href="/">← AI Profit Engine</a><section class="panel"><p style="color:#ff8991;font-weight:800;letter-spacing:.12em">A.P.E. PILOT ACCESS</p><h1>Business sign in</h1><p>Approved pilot businesses can sign in with a one-time code sent to their email.</p><form id="request"><label for="email">Application email</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button type="submit">Send sign-in code</button></form><form id="verify" class="hidden"><label for="code">Six-digit email code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Sign in</button></form><div id="account" class="hidden"><p id="welcome"></p><button id="logout" type="button">Sign out</button></div><p id="status" role="status" aria-live="polite"></p><p><small>Access is available only after your pilot application has been approved. Codes expire after 10 minutes.</small></p></section></main><script>const $=id=>document.getElementById(id);async function api(body){const r=await fetch('/api/pilot-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function check(){try{const r=await fetch('/api/pilot-auth',{cache:'no-store'});const j=await r.json();if(j.authenticated){$('request').classList.add('hidden');$('verify').classList.add('hidden');$('account').classList.remove('hidden');$('welcome').textContent='Signed in as '+j.business_name+' ('+j.email+'). Your pilot workspace is being prepared.'}}catch{}}$('request').onsubmit=async e=>{e.preventDefault();const btn=$('request').querySelector('button');btn.disabled=true;try{const r=await api({action:'request',email:$('email').value});$('status').textContent=r.message;$('verify').classList.remove('hidden')}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};$('verify').onsubmit=async e=>{e.preventDefault();const btn=$('verify').querySelector('button');btn.disabled=true;try{await api({action:'verify',email:$('email').value,code:$('code').value});$('status').textContent='Signed in.';await check()}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};$('logout').onclick=async()=>{await api({action:'logout'});location.reload()};check();</script></body></html>
